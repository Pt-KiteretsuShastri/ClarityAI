name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find background content lib popup -type f -name '*.js' -print0 | xargs -0 -I {} sh -c 'node --input-type=module --check < "$1"' sh {}
      - name: Check manifest assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const assets = [m.background.service_worker, m.action.default_popup,
            ...Object.values(m.icons), ...Object.values(m.action.default_icon),
            ...m.content_scripts.flatMap(s => [...(s.js || []), ...(s.css || [])])];
          for (const asset of assets) {
            if (!fs.existsSync(asset)) throw new Error('Missing asset: ' + asset);
          }
          NODE
